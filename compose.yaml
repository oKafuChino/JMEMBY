services:
  app:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app-data/jmemby.db
      STORAGE_ROOT: /storage
    volumes:
      - ./data/app:/app-data
      - ./data/storage:/storage
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: [CMD, python, -m, jmemby.main, health]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  komga:
    image: ${KOMGA_IMAGE:?Set KOMGA_IMAGE to a verified versioned image}
    user: ${APP_UID:-1000}:${APP_GID:-1000}
    volumes:
      - ./data/komga:/config
      - ./data/storage/library:/data:ro
    ports:
      - 127.0.0.1:25600:25600
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
