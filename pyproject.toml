[project]
name = "jmemby"
version = "0.1.0"
description = "Telegram-managed manga downloader for Komga"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=44,<51",
  "aiogram>=3.13,<4",
  "Pillow>=12,<13",
  "jmcomic>=2.5,<3",
  "tzdata>=2025.2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
jmemby = "jmemby.main:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
